[project]
name = "world-of-warcraft"
version = "0.1.0"
description = "System to translate World of Warcraft"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "curl-cffi>=0.15.0",
    "dashscope>=1.25.21",
    "fastembed>=0.8.0",
    "google>=3.0.0",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "langchain>=1.3.1",
    "langchain-core>=1.4.0",
    "langchain-google-genai>=4.2.3",
    "langchain-openai>=1.2.2",
    "langchain-qwq>=0.3.5",
    "json-repair>=0.53.1",
    "openpyxl>=3.1.5",
    "pandas>=2.3.0",
    "pyodbc>=5.3.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.18.0",
    "sqlalchemy>=2.0.50",
    "xlsxwriter>=3.2.9",
    "tavily-python>=0.7.26",
    "tqdm>=4.67.3",
    "onnxruntime-directml>=1.24.4",
    "anthropic>=0.117.0",
]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "mypy>=2.1.0",
    "nbstripout>=0.9.1",
    "pip-audit>=2.10.0",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
    "types-pyyaml>=6.0.12.20260518",
]

[tool.uv]
# fastembed ciagnie zwykly onnxruntime (CPU), ktory gryzie sie z onnxruntime-directml
# o ten sam import 'onnxruntime'. Override z markerem 'linux' sprawia, ze na Windows
# onnxruntime NIE instaluje sie wcale - import daje wylacznie onnxruntime-directml (iGPU).
# Jesli kiedys bedziesz odpalac projekt na Linuksie, tam wroci zwykly onnxruntime (CPU).
override-dependencies = [
    "onnxruntime; sys_platform == 'linux'",
]
